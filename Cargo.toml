[package]
name = "rust_neural_networks"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_neural_networks"
path = "src/lib.rs"

[dependencies]
cblas = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }
cudarc = { version = "0.12", optional = true }

[features]
shared_activations = []
gpu-metal = ["dep:metal", "dep:objc"]
gpu-cuda = ["dep:cudarc"]

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.14", features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
openblas-src = { version = "0.10", features = ["static", "cblas"] }

# NOTE: Windows requires OpenBLAS to be installed via vcpkg or system package.
# Install with: vcpkg install openblas:x64-windows
[target.'cfg(target_os = "windows")'.dependencies]
openblas-src = { version = "0.10", features = ["system", "cblas"] }

[dev-dependencies]
approx = "0.5"
tempfile = "3.24.0"

[profile.release]
lto = true
codegen-units = 1
